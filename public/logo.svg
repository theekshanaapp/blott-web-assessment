<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left bracket -->
  <text x="0" y="36" font-family="monospace" font-size="32" font-weight="400" fill="white">&lt;</text>
  
  <!-- Circle with diagonal line and curved arrow -->
  <g transform="translate(32, 24)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="16" stroke="white" stroke-width="2" fill="none"/>
    
    <!-- Curved arrow/C shape -->
    <path d="M 8 0 A 8 8 0 0 1 -8 0" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M -6 -2 L -8 0 L -6 2" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Diagonal line -->
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Right bracket -->
  <text x="64" y="36" font-family="monospace" font-size="32" font-weight="400" fill="white">&gt;</text>
  
  <!-- BLOTT text -->
  <text x="88" y="36" font-family="sans-serif" font-size="32" font-weight="700" fill="white" letter-spacing="0.02em">BLOTT</text>
</svg>
